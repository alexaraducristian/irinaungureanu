name: Trigger main site deploy

# Site-ul irinaungureanu este publicat ca parte a deploy-ului site-ului
# principal (alexaraducristian.github.io), pentru a fi servit la
# https://alexavolt.ro/irinaungureanu/.
#
# Codul rămâne în acest repo separat. La fiecare push pe main, acest
# workflow doar notifică repo-ul principal să ruleze din nou deploy-ul,
# care va reconstrui și acest site sub /irinaungureanu/.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Notifică repo-ul principal să facă deploy
        env:
          GH_TOKEN: ${{ secrets.MAIN_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Lipsește secretul MAIN_SITE_DISPATCH_TOKEN. Vezi README pentru configurare."
            exit 1
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alexaraducristian/alexaraducristian.github.io/dispatches \
            -d '{"event_type":"deploy-irinaungureanu"}'
